services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trailerlens
      POSTGRES_PASSWORD: trailerlens
      POSTGRES_DB: trailerlens
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trailerlens"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Optional: run the app itself in Docker (uses PostgreSQL above).
  # Start with: docker compose --profile app up --build
  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://trailerlens:trailerlens@db:5432/trailerlens
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-dev-secret-change-me}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      MOCK_MODE: ${MOCK_MODE:-false}
      # yt-dlp adapter is intentionally NOT enabled in containers by default.
      ENABLE_EXPERIMENTAL_YTDLP: "false"
    ports:
      - "3000:3000"

volumes:
  pgdata:
