name: Build and publish Docker image

# Render 무료 플랜 빌드 머신(512MB)에서 pnpm install + next build를 직접
# 돌리면 메모리가 부족해서 죽습니다. 대신 이 워크플로우가 GitHub Actions의
# 넉넉한 러너에서 이미지를 미리 만들어 GHCR에 올리고, Render는 완성된
# 이미지를 그냥 받아서 실행만 하게 합니다.

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # GHCR 이미지 이름은 소문자만 허용합니다. 저장소 소유자(NOLF001)에
      # 대문자가 있어서 그대로 쓰면 태그가 깨집니다.
      - name: Compute lowercase image name
        id: image
        run: echo "name=${REPO,,}" >> "$GITHUB_OUTPUT"
        env:
          REPO: ${{ github.repository }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:latest
            ${{ env.REGISTRY }}/${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
