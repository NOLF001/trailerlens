# Render 배포 청사진(Blueprint).
#
# Render 대시보드 → New → Blueprint → 이 저장소 선택 하면
# 웹 서비스와 PostgreSQL이 이 파일대로 한 번에 만들어집니다.
#
# sync: false 로 표시된 값은 Render가 물어봅니다(비밀값이라 파일에 넣지 않습니다).
#   YOUTUBE_API_KEY  — 유튜브 댓글 수집용
#   SITE_PASSWORD    — 사이트 접근 암호 (비워두면 누구나 접근)
#
# 참고: Docker 런타임을 쓰는 이유는 yt-dlp 실행이 필요하기 때문입니다.
# 서버리스 환경에서는 앱이 yt-dlp를 자동으로 비활성화합니다.

services:
  - type: web
    name: trailerlens
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trailerlens-db
          property: connectionString

      # 유튜브 실데이터 수집에 필요합니다.
      - key: YOUTUBE_API_KEY
        sync: false

      # 접근 암호. 설정하면 모든 페이지·API에 Basic 인증이 걸립니다.
      - key: SITE_PASSWORD
        sync: false

      # 공개 모드: 데이터 삭제 API를 전부 거부합니다.
      - key: PUBLIC_DEMO
        value: "true"

      # Claude API는 쓰지 않습니다. 비워두면 무료 로컬 분석기로 동작합니다.
      - key: ANTHROPIC_API_KEY
        value: ""

      - key: MOCK_MODE
        value: "false"

      # 유튜브 '가장 많이 다시 본 구간' 수집 (이미지에 yt-dlp 설치됨)
      - key: ENABLE_EXPERIMENTAL_YTDLP
        value: "true"
      - key: YTDLP_PATH
        value: yt-dlp

      - key: NEXTAUTH_SECRET
        generateValue: true

databases:
  - name: trailerlens-db
    plan: free
    databaseName: trailerlens
    user: trailerlens
